name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  publish:
    name: Publish packages and GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Validate and extract tag version
        id: version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use SemVer format vX.Y.Z or vX.Y.Z-prerelease." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore dependencies
        run: dotnet restore Murchalka.ModuleProtocol.slnx

      - name: Build
        run: >-
          dotnet build Murchalka.ModuleProtocol.slnx
          --configuration Release
          --no-restore
          -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --solution Murchalka.ModuleProtocol.slnx --configuration Release --no-build --no-restore

      - name: Pack release
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          projects=(
            src/Murchalka.ModuleProtocol.Contracts/Murchalka.ModuleProtocol.Contracts.csproj
            src/Murchalka.ModuleProtocol.Client/Murchalka.ModuleProtocol.Client.csproj
            src/Murchalka.ModuleProtocol.Grpc/Murchalka.ModuleProtocol.Grpc.csproj
            src/Murchalka.ModuleProtocol.Json/Murchalka.ModuleProtocol.Json.csproj
            src/Murchalka.ModuleProtocol.Transport/Murchalka.ModuleProtocol.Transport.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "${project}" \
              --configuration Release \
              --no-build \
              --no-restore \
              --output artifacts/packages \
              -p:PackageVersion="${PACKAGE_VERSION}"
          done

      - name: Publish to GitHub Packages
        shell: bash
        env:
          PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "${package}" \
              --source "${PACKAGE_SOURCE}" \
              --api-key "${PACKAGE_TOKEN}" \
              --skip-duplicate
          done

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/packages/*.nupkg --clobber
            exit 0
          fi

          args=(--verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/packages/*.nupkg "${args[@]}"
