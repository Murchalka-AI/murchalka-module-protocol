name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore Murchalka.ModuleProtocol.slnx

      - name: Build
        run: dotnet build Murchalka.ModuleProtocol.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Murchalka.ModuleProtocol.slnx --configuration Release --no-build --no-restore

  package:
    name: Verify NuGet packages
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore Murchalka.ModuleProtocol.slnx

      - name: Build
        run: dotnet build Murchalka.ModuleProtocol.slnx --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          projects=(
            src/Murchalka.ModuleProtocol.Contracts/Murchalka.ModuleProtocol.Contracts.csproj
            src/Murchalka.ModuleProtocol.Client/Murchalka.ModuleProtocol.Client.csproj
            src/Murchalka.ModuleProtocol.Grpc/Murchalka.ModuleProtocol.Grpc.csproj
            src/Murchalka.ModuleProtocol.Json/Murchalka.ModuleProtocol.Json.csproj
            src/Murchalka.ModuleProtocol.Transport/Murchalka.ModuleProtocol.Transport.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "${project}" --configuration Release --no-build --no-restore --output artifacts/packages
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: protocol-nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14
